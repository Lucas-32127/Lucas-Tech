<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSVALDO SHOPPING</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0f1c;color:white}
.header{background:#132040;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ffcc00;position:sticky;top:0;z-index:100}
.header h1{color:#ffcc00;font-size:20px}
.btn-top{background:#ffcc00;color:#0a2540;border:none;padding:8px 14px;border-radius:20px;font-weight:900;font-size:12px;margin-left:6px}
.banner{background:#ffcc00;color:#0a2540;text-align:center;padding:8px;font-weight:900;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;max-width:700px;margin:auto}
.loja{background:#132040;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:12px;border:1px solid #1e335a}
.loja img{width:100%;height:135px;object-fit:cover}
.loja h3{font-size:13px;margin:6px}
.loja .preco{color:#ffcc00;font-weight:900}
.btn-wpp{background:#25D366;color:white;padding:7px 14px;border-radius:20px;font-size:12px;text-decoration:none;display:inline-block;margin-top:5px;font-weight:bold}
#adm{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:999;padding:15px;overflow-y:auto}
.caixa{background:#132040;padding:20px;border-radius:14px;max-width:520px;margin:auto;border:2px solid #ffcc00}
.caixa input{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #1e335a;background:#0a0f1c;color:white}
.btn{width:100%;background:#ffcc00;color:#0a2540;padding:12px;border:none;border-radius:25px;font-weight:900;margin-top:10px}
</style>
</head>
<body>
<div class="header">
<h1>OSVALDO <span style="color:white">SHOPPING</span></h1>
<div>
<button class="btn-top" onclick="document.getElementById('adm').style.display='block'">🛠️ FERRAMENTAS</button>
<button class="btn-top" onclick="document.getElementById('adm').style.display='block'">🔐 ADM</button>
</div>
</div>
<div class="banner">🔥 OSVALDO SHOPPING - 953 351 052 - ENTREGA 24H 🔥</div>
<div class="grid" id="grid"></div>

<div id="adm">
<div class="caixa">
<h2 style="color:#ffcc00">🔐 ADM OSVALDO</h2>
<input type="password" id="senha" placeholder="Senha: osvaldo123">
<button class="btn" onclick="login()">ENTRAR</button>
<div id="logado" style="display:none">
<input id="nome" placeholder="Nome produto">
<input id="preco" placeholder="Preço">
<input id="foto" placeholder="Link foto">
<input id="loja" placeholder="Loja">
<button class="btn" onclick="add()">SALVAR PRODUTO</button>
<div id="lista" style="margin-top:15px"></div>
<button class="btn" style="background:#ff3b3b;color:white" onclick="document.getElementById('adm').style.display='none'">SAIR</button>
</div>
</div>
</div>

<script>
const ZAP="244953351052";
let produtos=JSON.parse(localStorage.getItem('osvaldo_produtos'))||[
{nome:"Smartwatch X8 Ultra",preco:"15000",foto:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",loja:"Osvaldo Tech"},
{nome:"Tênis Nike Air",preco:"18000",foto:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",loja:"Osvaldo Shoes"},
{nome:"Fone Bluetooth Pro",preco:"8500",foto:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500",loja:"Osvaldo Eletrônicos"}
];
function render(){
let g=document.getElementById('grid');g.innerHTML="";
let l=document.getElementById('lista');l.innerHTML="";
produtos.forEach((p,i)=>{
g.innerHTML+=`<div class="loja"><img src="${p.foto}"><h3>${p.nome}</h3><div style="font-size:11px;color:#aaa">${p.loja}</div><div class="preco">${p.preco} Kz</div><a class="btn-wpp" href="https://wa.me/${ZAP}?text=Olá%20OSVALDO%20SHOPPING!%20Quero%20${encodeURIComponent(p.nome)}">Comprar 1 Clique</a></div>`;
l.innerHTML+=`<div style="background:#0a0f1c;padding:8px;margin:5px 0;border-radius:8px;display:flex;justify-content:space-between;font-size:12px">${p.nome} <span style="color:red" onclick="produtos.splice(${i},1);localStorage.setItem('osvaldo_produtos',JSON.stringify(produtos));render()">X</span></div>`;
});
}
function login(){if(document.getElementById('senha').value==="osvaldo123"){document.getElementById('logado').style.display='block';}else{alert('Senha errada');}}
function add(){let n=document.getElementById('nome').value, pr=document.getElementById('preco').value, f=document.getElementById('foto').value, lj=document.getElementById('loja').value; if(!n||!pr)return alert('Nome e preço'); produtos.unshift({nome:n,preco:pr,foto:f||'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500',loja:lj||'Osvaldo Shopping'}); localStorage.setItem('osvaldo_produtos',JSON.stringify(produtos)); render();}
render();
</script>
</body>
</html>
